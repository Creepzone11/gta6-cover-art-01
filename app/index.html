<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast — GTA-style Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>NEON COAST</h1>
    <p>Turn any photo and caption into a multi-panel poster cover. Photos never leave your machine.</p>

    <section class="group">
      <h2>Photos</h2>
      <button id="addPhotos" type="button">Add photos</button>
      <input id="photoFiles" type="file" accept="image/*" multiple hidden>
      <p class="hint">Or try a sample:</p>
      <div class="samples">
        <button type="button" data-sample="pier">Pier</button>
        <button type="button" data-sample="boulevard">Boulevard</button>
      </div>
      <div id="thumbs" class="thumbs"></div>
      <p class="hint">Click a panel in the preview, then pick a photo for it. Drag a panel to move its photo, scroll to zoom.</p>
    </section>

    <section class="group">
      <h2>Caption</h2>
      <label>Title <input id="title" type="text" maxlength="40" value="Neon Shore"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="60" value="a Vice City story"></label>
    </section>

    <section class="group">
      <h2>Layout</h2>
      <div id="layouts" class="row"></div>
    </section>

    <section class="group">
      <h2>Grade</h2>
      <div id="grades" class="row"></div>
    </section>

    <section class="group">
      <h2>Size</h2>
      <div id="sizes" class="row"></div>
    </section>

    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>
  </section>

  <section class="stage">
    <canvas id="preview" width="1920" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
